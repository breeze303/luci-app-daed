<script type="text/javascript">
	//<![CDATA[
	var autoRefreshEnabled = true;
	var scrolled = false;

	function clear_log(btn) {
		XHR.post('<%=url([[admin]], [[services]], [[daed]], [[clear_log]])%>', null,
			function(x, data) {
				if(x && x.status == 200) {
					var log_textarea = document.getElementById('log_textarea');
					log_textarea.value = "";
					log_textarea.scrollTop = log_textarea.scrollHeight;
				}
				location.reload();
			}
		);
	}

	function fetch_log(force) {
		if (force !== true && !autoRefreshEnabled)
			return;

		XHR.get('<%=url([[admin]], [[services]], [[daed]], [[get_log]])%>', null,
		function(x, data) {
			if(x && x.status == 200) {
				var log_textarea = document.getElementById('log_textarea');
				if (force !== true && !autoRefreshEnabled)
					return;

				log_textarea.value = x.responseText;
				if (!scrolled) {
					log_textarea.scrollTop = log_textarea.scrollHeight;
					scrolled = true;
				}
			}
		}
	);
	}

	function refresh_log(btn) {
		fetch_log(true);
	}

	function toggle_auto_refresh(btn) {
		autoRefreshEnabled = !autoRefreshEnabled;
		btn.value = autoRefreshEnabled ? '<%:Disable auto refresh%>' : '<%:Enable auto refresh%>';

		if (autoRefreshEnabled)
			fetch_log(true);
	}

	window.setInterval(function() {
		fetch_log(false);
	}, 2000);
	fetch_log(true);
	//]]>
</script>
<fieldset class="cbi-section" id="_log_fieldset">
	<input class="cbi-button cbi-input-remove" type="button" onclick="clear_log()" value="<%:Clear logs%>" style="margin-left: 10px; margin-top: 10px;">
	<input id="refresh_log_button" class="cbi-button" type="button" onclick="refresh_log(this)" value="<%:Refresh logs%>" style="margin-left: 10px; margin-top: 10px;">
	<input id="auto_refresh_button" class="cbi-button" type="button" onclick="toggle_auto_refresh(this)" value="<%:Disable auto refresh%>" style="margin-left: 10px; margin-top: 10px;">
	<textarea id="log_textarea" class="cbi-input-textarea" style="width: calc(100% - 20px); height: 645px; margin: 10px;" data-update="change" rows="5" wrap="off" readonly="readonly"></textarea>
</fieldset>
